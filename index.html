<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Hub - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #1e293b, #0f172a); color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .btn-disabled { opacity: 0.2; cursor: not-allowed !important; filter: grayscale(1); }
        .btn-completed { opacity: 0.6; background: #1e293b !important; color: #64748b !important; border: 1px solid #334155; cursor: not-allowed !important; }
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-view { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <!-- MÓDULO DE ACCESO (Login / Registro) -->
    <div id="view-auth" class="w-full max-w-sm glass rounded-[2.5rem] p-8 shadow-2xl animate-view">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-cyan-500/10 rounded-2xl mb-4 border border-cyan-500/20 text-cyan-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            </div>
            <h1 id="auth-title" class="text-3xl font-black uppercase tracking-tighter">Attendance Hub</h1>
            <p id="auth-subtitle" class="text-slate-400 text-sm mt-2">Identifíquese para su registro laboral.</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest">Email Corporativo</label>
                <input type="email" id="email" placeholder="usuario@empresa.com" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl px-5 py-3.5 focus:outline-none focus:border-cyan-500 transition-all text-white">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl px-5 py-3.5 focus:outline-none focus:border-cyan-500 transition-all text-white">
            </div>
            <button id="btn-auth" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                <span id="btn-auth-text">Ingresar</span>
                <div id="auth-spinner" class="hidden animate-spin h-5 w-5 border-2 border-white/30 border-t-white rounded-full"></div>
            </button>
            <div class="text-center">
                <button onclick="toggleAuthMode()" id="btn-toggle-mode" class="text-xs text-slate-500 hover:text-cyan-400 transition-colors underline decoration-dotted">¿No tiene cuenta? Regístrese</button>
            </div>
            <div id="auth-error-box" class="hidden bg-rose-500/10 border border-rose-500/20 p-4 rounded-2xl mt-4">
                <p id="auth-error" class="text-rose-400 text-[11px] font-medium leading-tight text-center"></p>
            </div>
        </div>
    </div>

    <!-- MÓDULO DE TERMINAL (Solo visible tras login) -->
    <div id="view-terminal" class="w-full max-w-md glass rounded-[2.5rem] p-6 shadow-2xl animate-view hidden">
        <div class="flex justify-between items-center mb-6">
            <div class="flex flex-col">
                <span class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest leading-none mb-1">Terminal Activa</span>
                <span id="user-email-display" class="text-xs text-slate-400 truncate max-w-[180px]">...</span>
            </div>
            <button onclick="logout()" class="p-3 bg-slate-800/50 rounded-xl text-slate-400 hover:text-rose-400 transition-all border border-white/5">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            </button>
        </div>

        <div class="text-center mb-8">
            <div id="display-main" class="text-6xl md:text-7xl font-mono font-bold text-cyan-400 drop-shadow-[0_0_15px_rgba(34,211,238,0.3)]">00:00:00</div>
            <p id="label-status" class="text-[10px] mt-2 font-bold uppercase tracking-[0.2em] text-slate-500">Sesión en espera</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-8">
            <div class="bg-slate-900/40 border border-white/5 p-4 rounded-2xl text-center">
                <span class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Break (<span id="count-break">0</span>/2)</span>
                <span id="display-break" class="text-lg font-mono font-bold text-sky-400">00:00:00</span>
            </div>
            <div class="bg-slate-900/40 border border-white/5 p-4 rounded-2xl text-center">
                <span class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Almuerzo</span>
                <span id="display-lunch" class="text-lg font-mono font-bold text-amber-400">00:00:00</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button id="btn-start" onclick="confirmAction('start')" class="py-4 rounded-xl font-bold bg-emerald-500 text-emerald-950 shadow-lg col-span-1 active:scale-95 transition-all">Iniciar Día</button>
            <button id="btn-end" onclick="confirmAction('end')" class="py-4 rounded-xl font-bold bg-rose-500 text-rose-950 shadow-lg col-span-1 active:scale-95 transition-all btn-disabled" disabled>Terminar Día</button>
            <button id="btn-s-break" onclick="trigger('start-break')" class="py-4 rounded-xl font-bold bg-sky-500 text-sky-950 active:scale-95 transition-all btn-disabled" disabled>Inicio Break</button>
            <button id="btn-e-break" onclick="trigger('end-break')" class="py-4 rounded-xl font-bold bg-slate-700 text-slate-100 active:scale-95 transition-all btn-disabled" disabled>Fin Break</button>
            <button id="btn-s-lunch" onclick="trigger('start-lunch')" class="py-4 rounded-xl font-bold bg-amber-500 text-amber-950 active:scale-95 transition-all btn-disabled" disabled>Almorzar</button>
            <button id="btn-e-lunch" onclick="trigger('end-lunch')" class="py-4 rounded-xl font-bold bg-slate-700 text-slate-100 active:scale-95 transition-all btn-disabled" disabled>Fin Almuerzo</button>
        </div>

        <div class="mt-8 border-t border-slate-700/50 pt-4">
            <h3 class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-3 text-center">Registro de Actividad</h3>
            <div id="log-container" class="space-y-2 max-h-32 overflow-y-auto custom-scrollbar pr-2"></div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-[#1e293b] w-full max-w-xs rounded-3xl p-6 border border-slate-700 shadow-2xl">
            <h3 id="modal-title" class="text-lg font-bold text-white mb-2 text-center uppercase tracking-tighter">Confirmar</h3>
            <p id="modal-msg" class="text-slate-400 text-sm mb-6 text-center"></p>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs uppercase tracking-widest transition-colors hover:bg-slate-700">No</button>
                <button id="modal-confirm" class="flex-1 py-3 rounded-xl font-bold text-white text-xs shadow-lg uppercase tracking-widest transition-all active:scale-95">Sí, Confirmar</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Credenciales extraídas de tu imagen image_eda604.png
        const firebaseConfig = {
            apiKey: "AIzaSyAmjUmLQsFr-O-lpcWxw6sL26Ojs3wbjSw",
            authDomain: "attendancehub-41626.firebaseapp.com",
            projectId: "attendancehub-41626",
            storageBucket: "attendancehub-41626.firebasestorage.app",
            messagingSenderId: "742866193834",
            appId: "1:742866193834:web:e43f0f9afface15b962fd3",
            measurementId: "G-V81823WH1D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "attendance-pro-system";

        let user = null;
        let loginMode = true;
        let timer = null;
        let session = {
            status: 'IDLE', total: 0, b_time: 0, l_time: 0, b_count: 0,
            l_done: false, b_done: false, logs: []
        };

        // --- MANEJO DE AUTENTICACIÓN ---
        window.toggleAuthMode = () => {
            loginMode = !loginMode;
            document.getElementById('auth-title').innerText = loginMode ? "Attendance Hub" : "Registro Nuevo";
            document.getElementById('btn-auth-text').innerText = loginMode ? "Ingresar" : "Crear Cuenta";
            document.getElementById('btn-toggle-mode').innerText = loginMode ? "¿No tiene cuenta? Regístrese" : "¿Ya tiene cuenta? Ingrese";
        };

        window.handleAuthAction = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const errBox = document.getElementById('auth-error-box');
            const errEl = document.getElementById('auth-error');
            const spinner = document.getElementById('auth-spinner');
            const label = document.getElementById('btn-auth-text');
            
            if (!email || !pass) return showError("Complete todos los campos.");
            
            errBox.classList.add('hidden');
            spinner.classList.remove('hidden'); label.classList.add('hidden');

            try {
                if (loginMode) await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                console.error("Firebase Auth Error:", e);
                let msg = e.message;
                if(e.code === 'auth/invalid-credential') msg = "Correo o contraseña incorrectos.";
                if(e.code === 'auth/invalid-api-key') msg = "API Key no válida. Por favor, asegúrese de que Identity Toolkit API esté habilitada en Google Cloud.";
                showError(msg);
            } finally {
                spinner.classList.add('hidden'); label.classList.remove('hidden');
            }
        };

        function showError(msg) {
            const errBox = document.getElementById('auth-error-box');
            const errEl = document.getElementById('auth-error');
            errEl.innerText = msg;
            errBox.classList.remove('hidden');
        }

        document.getElementById('btn-auth').onclick = handleAuthAction;

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-terminal').classList.remove('hidden');
                document.getElementById('user-email-display').innerText = user.email;
                syncData();
            } else {
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('view-terminal').classList.add('hidden');
                stopLocalTimer();
            }
        });

        window.logout = () => signOut(auth);

        // --- MANEJO DE BASE DE DATOS (Firestore) ---
        function syncData() {
            if (!user) return;
            const today = new Date().toISOString().split('T')[0];
            const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'sessions', today);
            
            onSnapshot(ref, (snap) => {
                if (snap.exists()) {
                    session = { ...session, ...snap.data() };
                    if (session.status !== 'IDLE' && session.status !== 'FINISHED') startLocalTimer();
                } else {
                    // Si es un día nuevo, reset local
                    session = { status: 'IDLE', total: 0, b_time: 0, l_time: 0, b_count: 0, l_done: false, b_done: false, logs: [] };
                }
                updateUI();
            });
        }

        async function pushData() {
            if (!user) return;
            const today = new Date().toISOString().split('T')[0];
            const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'sessions', today);
            await setDoc(ref, { ...session, lastUpdate: serverTimestamp() }, { merge: true });
        }

        // --- LÓGICA DE TIEMPOS ---
        function format(s) {
            const h = Math.floor(s / 3600).toString().padStart(2, '0');
            const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${h}:${m}:${sec}`;
        }

        function updateUI() {
            document.getElementById('display-main').innerText = format(session.total);
            document.getElementById('display-break').innerText = format(session.b_time);
            document.getElementById('display-lunch').innerText = format(session.l_time);
            document.getElementById('count-break').innerText = session.b_count;

            const label = document.getElementById('label-status');
            if (session.status === 'WORKING') { label.innerText = "TRABAJANDO"; label.className = "text-[10px] mt-2 font-bold uppercase tracking-[0.2em] text-emerald-400"; }
            else if (session.status === 'ON_LUNCH') { label.innerText = "ALMUERZO (PAUSA)"; label.className = "text-[10px] mt-2 font-bold uppercase tracking-[0.2em] text-amber-400"; }
            else if (session.status === 'ON_BREAK') { label.innerText = "BREAK (PAGADO)"; label.className = "text-[10px] mt-2 font-bold uppercase tracking-[0.2em] text-sky-400"; }
            else if (session.status === 'FINISHED') { label.innerText = "TURNO FINALIZADO"; label.className = "text-[10px] mt-2 font-bold uppercase tracking-[0.2em] text-rose-500 font-black"; }
            else { label.innerText = "SESIÓN EN ESPERA"; label.className = "text-[10px] mt-2 font-bold uppercase tracking-[0.2em] text-slate-500"; }

            const b = (id) => document.getElementById(id);
            b('btn-start').disabled = session.status !== 'IDLE';
            b('btn-end').disabled = ['IDLE', 'FINISHED', 'ON_BREAK', 'ON_LUNCH'].includes(session.status);
            
            if (session.b_done) { b('btn-s-break').classList.add('btn-completed'); b('btn-s-break').innerText = "Terminado"; b('btn-e-break').disabled = true; b('btn-s-break').disabled = true; }
            else { b('btn-s-break').disabled = session.status !== 'WORKING' || session.b_count >= 2; b('btn-e-break').disabled = session.status !== 'ON_BREAK'; }

            if (session.l_done) { b('btn-s-lunch').classList.add('btn-completed'); b('btn-s-lunch').innerText = "Terminado"; b('btn-e-lunch').disabled = true; b('btn-s-lunch').disabled = true; }
            else { b('btn-s-lunch').disabled = session.status !== 'WORKING'; b('btn-e-lunch').disabled = session.status !== 'ON_LUNCH'; }

            document.getElementById('log-container').innerHTML = session.logs.map(l => `
                <div class="flex justify-between text-[9px] bg-white/5 p-2 rounded-lg border-l-2 border-cyan-500 mb-2">
                    <span class="font-bold text-slate-200 uppercase tracking-tighter">${l.act}</span>
                    <span class="font-mono text-slate-500">${l.time}</span>
                </div>
            `).join('');

            ['btn-start', 'btn-end', 'btn-s-break', 'btn-e-break', 'btn-s-lunch', 'btn-e-lunch'].forEach(id => {
                const el = b(id);
                if (el.disabled && !el.classList.contains('btn-completed')) el.classList.add('btn-disabled');
                else if (!el.disabled) el.classList.remove('btn-disabled');
            });
        }

        function startLocalTimer() {
            if (timer) return;
            timer = setInterval(() => {
                // El tiempo principal SOLO se detiene en ALMUERZO
                if (session.status === 'WORKING' || session.status === 'ON_BREAK') session.total++;
                if (session.status === 'ON_BREAK') session.b_time++;
                if (session.status === 'ON_LUNCH') session.l_time++;
                if (session.total % 10 === 0) pushData(); 
                updateUI();
            }, 1000);
        }

        function stopLocalTimer() { clearInterval(timer); timer = null; }

        window.trigger = (act) => {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            if (act === 'start-day') { session.status = 'WORKING'; session.logs.unshift({ act: 'Entrada', time }); startLocalTimer(); }
            if (act === 'end-day') { session.status = 'FINISHED'; session.logs.unshift({ act: 'Salida', time }); stopLocalTimer(); }
            if (act === 'start-break') { session.status = 'ON_BREAK'; session.b_count++; session.logs.unshift({ act: `Break #${session.b_count}`, time }); }
            if (act === 'end-break') { session.status = 'WORKING'; session.logs.unshift({ act: 'Fin Break', time }); if (session.b_count >= 2) session.b_done = true; }
            if (act === 'start-lunch') { session.status = 'ON_LUNCH'; session.logs.unshift({ act: 'Almuerzo', time }); }
            if (act === 'end-lunch') { session.status = 'WORKING'; session.logs.unshift({ act: 'Fin Almuerzo', time }); session.l_done = true; }
            pushData();
        };

        window.confirmAction = (type) => {
            const modal = document.getElementById('modal');
            const btn = document.getElementById('modal-confirm');
            if (type === 'start') {
                document.getElementById('modal-msg').innerText = "¿Desea iniciar su jornada laboral?";
                btn.className = "flex-1 py-3 rounded-xl font-bold text-white text-xs bg-emerald-600 shadow-lg";
                btn.onclick = () => { trigger('start-day'); closeModal(); };
            } else {
                document.getElementById('modal-msg').innerText = "¿Está seguro de finalizar su turno por hoy?";
                btn.className = "flex-1 py-3 rounded-xl font-bold text-white text-xs bg-rose-600 shadow-lg";
                btn.onclick = () => { trigger('end-day'); closeModal(); };
            }
            modal.classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');
    </script>
</body>
</html>
